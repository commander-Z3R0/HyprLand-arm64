name: Build Hyprland .deb (arm64 / Debian trixie)

on:
  workflow_dispatch:
    inputs:
      hyprland_version:
        description: "Hyprland tag (e.g. v0.51.1)"
        required: true
        default: "v0.51.1"
      wayland_protocols_version:
        description: "wayland-protocols tag (must be >= 1.45)"
        required: true
        default: "1.45"
      create_release:
        description: "Publish the .deb as a GitHub Release"
        type: boolean
        default: false

permissions:
  contents: write

env:
  HYPRLAND_VERSION: ${{ inputs.hyprland_version }}
  WAYLAND_PROTOCOLS_VERSION: ${{ inputs.wayland_protocols_version }}

jobs:
  build:
    # Native ARM64 runner (free for public repos). Avoids QEMU, which is very slow.
    runs-on: ubuntu-24.04-arm
    container:
      image: debian:trixie   # gcc 14 (wayland-protocols is built from source below)
    defaults:
      run:
        shell: bash

    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git curl wget xz-utils tar file pkg-config dpkg-dev \
            build-essential cmake ninja-build meson gettext gettext-base \
            glslang-tools hwdata \
            libwayland-dev wayland-protocols libffi-dev libxml2-dev libglib2.0-dev \
            libdrm-dev libgbm-dev libegl-dev libgles-dev libegl1-mesa-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxkbregistry-dev \
            libinput-dev libudev-dev libseat-dev libsystemd-dev \
            libpixman-1-dev libcairo2-dev libpango1.0-dev fontconfig libfontconfig-dev \
            libliftoff-dev libdisplay-info-dev libzip-dev librsvg2-dev libmagic-dev \
            libre2-dev libmuparser-dev libtomlplusplus-dev libpugixml-dev \
            libjpeg-dev libwebp-dev libspng-dev libxcursor-dev \
            libxcb1-dev libxcb-composite0-dev libxcb-dri3-dev libxcb-ewmh-dev \
            libxcb-icccm4-dev libxcb-present-dev libxcb-render-util0-dev \
            libxcb-res0-dev libxcb-xfixes0-dev libxcb-xinput-dev \
            libxcb-errors-dev libxcb-util-dev libx11-xcb-dev \
            libavutil-dev libavcodec-dev libavformat-dev \
            libpci-dev libuuid1 uuid-dev

      # Debian trixie ships wayland-protocols 1.44, Hyprland needs >= 1.45.
      # It only contains protocol XML files, so it is needed at build time only
      # (it is NOT staged into /out / the .deb).
      - name: Build wayland-protocols from source
        run: |
          set -euxo pipefail
          cd /tmp
          git clone --depth 1 --branch "${WAYLAND_PROTOCOLS_VERSION}" \
            https://gitlab.freedesktop.org/wayland/wayland-protocols.git
          cd wayland-protocols
          meson setup build --prefix=/usr --buildtype=release -Dtests=false
          meson install -C build
          pkg-config --modversion wayland-protocols

      - name: Build hyprwm dependencies
        run: |
          set -euxo pipefail
          mkdir -p /out /tmp/deps && cd /tmp/deps

          # Builds a hyprwm repo with CMake or meson (auto-detected),
          # installs it into the system (for the next builds) and into /out (for the .deb)
          build_dep () {
            local repo="$1"
            git clone --depth 1 "https://github.com/hyprwm/${repo}.git"
            cd "$repo"
            if [ -f CMakeLists.txt ]; then
              cmake -S . -B build -G Ninja \
                -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
              cmake --build build -j"$(nproc)"
              cmake --install build
              DESTDIR=/out cmake --install build
            elif [ -f meson.build ]; then
              meson setup build --prefix=/usr --buildtype=release
              meson compile -C build
              meson install -C build
              DESTDIR=/out meson install -C build --no-rebuild
            else
              echo "No CMakeLists.txt or meson.build found in ${repo}" >&2
              exit 1
            fi
            cd ..
          }

          # Order matters (each one depends on the previous ones)
          build_dep hyprwayland-scanner
          build_dep hyprutils
          build_dep hyprlang
          build_dep hyprgraphics
          build_dep hyprcursor
          build_dep aquamarine
          build_dep hyprland-protocols

          ldconfig

      - name: Download Hyprland (release tarball, submodules included)
        run: |
          set -euxo pipefail
          cd /tmp
          curl -fL -o hypr.tar.gz \
            "https://github.com/hyprwm/Hyprland/releases/download/${HYPRLAND_VERSION}/source-${HYPRLAND_VERSION}.tar.gz"
          mkdir hyprland && tar -xzf hypr.tar.gz -C hyprland --strip-components=1

      - name: Build Hyprland
        run: |
          set -euxo pipefail
          cd /tmp/hyprland
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build -j"$(nproc)"
          cmake --install build
          DESTDIR=/out cmake --install build

      - name: Build .deb package
        run: |
          set -euxo pipefail
          DEB_VERSION="${HYPRLAND_VERSION#v}-1"
          PKGDIR=/tmp/pkg
          rm -rf "$PKGDIR" && mkdir -p "$PKGDIR"
          cp -a /out/. "$PKGDIR"/

          # Strip binaries and shared libraries to keep the package small
          find "$PKGDIR" -type f \( -perm -u+x -o -name '*.so*' \) -exec sh -c \
            'file "$1" | grep -q "ELF" && strip --strip-unneeded "$1" || true' _ {} \;

          # Auto-detect runtime dependencies with dpkg-shlibdeps
          mkdir -p /tmp/shl/debian
          printf 'Source: hyprland\n\nPackage: hyprland\nArchitecture: arm64\n' > /tmp/shl/debian/control
          ELF_FILES=$(find "$PKGDIR" -type f -exec sh -c 'file "$1" | grep -q "ELF" && echo "$1"' _ {} \;)
          LIBDIR=$(dirname "$(find "$PKGDIR" -name 'libhyprutils.so*' | head -n1)")
          cd /tmp/shl
          SHLIBS=$(dpkg-shlibdeps -O --ignore-missing-info -l"$LIBDIR" $ELF_FILES 2>/dev/null \
                   | sed -n 's/^shlibs:Depends=//p' || true)
          cd /

          # Write the control file (Depends only added if it is not empty)
          mkdir -p "$PKGDIR/DEBIAN"
          {
            echo "Package: hyprland"
            echo "Version: ${DEB_VERSION}"
            echo "Architecture: arm64"
            echo "Maintainer: ${GITHUB_REPOSITORY_OWNER} <noreply@users.noreply.github.com>"
            echo "Section: x11"
            echo "Priority: optional"
            if [ -n "${SHLIBS}" ]; then echo "Depends: ${SHLIBS}"; fi
            echo "Recommends: xwayland, seatd"
            echo "Description: Hyprland ${HYPRLAND_VERSION} - dynamic tiling Wayland compositor"
            echo " Custom arm64 build of Hyprland bundled with hyprutils, hyprlang,"
            echo " hyprgraphics, hyprcursor, aquamarine and hyprland-protocols."
          } > "$PKGDIR/DEBIAN/control"

          # Refresh the dynamic linker cache on install/remove
          printf '#!/bin/sh\nset -e\nldconfig\n' > "$PKGDIR/DEBIAN/postinst"
          cp "$PKGDIR/DEBIAN/postinst" "$PKGDIR/DEBIAN/postrm"
          chmod 755 "$PKGDIR/DEBIAN/postinst" "$PKGDIR/DEBIAN/postrm"

          cat "$PKGDIR/DEBIAN/control"

          dpkg-deb --root-owner-group --build "$PKGDIR" \
            "/tmp/hyprland_${DEB_VERSION}_arm64.deb"

          dpkg-deb --info "/tmp/hyprland_${DEB_VERSION}_arm64.deb"

      - name: Smoke test (install the .deb)
        run: |
          set -euxo pipefail
          apt-get install -y /tmp/hyprland_*_arm64.deb
          file /usr/bin/Hyprland
          Hyprland --version

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hyprland-${{ inputs.hyprland_version }}-arm64-deb
          path: /tmp/hyprland_*_arm64.deb

      - name: Create Release
        if: ${{ inputs.create_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.hyprland_version }}-arm64
          files: /tmp/hyprland_*_arm64.deb
